org.gradle.jvmargs=-Xmx1536M
android.useAndroidX=true
android.enableJetifier=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# AGP 9 runs R8 in strict full mode, where `-keep class X` no longer keeps X's
# default constructor. WorkManager 2.7.0 (pulled in by play-services-ads) ships
# Room 2.2.5, whose only rule is `-keep class * extends RoomDatabase`, so R8
# stripped WorkDatabase_Impl.<init>() and the app crashed at startup with
# "Failed to create an instance of androidx.work.impl.WorkDatabase".
android.r8.strictFullModeForKeepRules=false
